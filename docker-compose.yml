services:
  vless:
    build: .
    image: pyvless:latest
    restart: unless-stopped
    environment:
      VLESS_UUID: "de8ce547-cabf-4f0a-bedf-3f7cb61250b1"
      VLESS_HOST: "0.0.0.0"
      VLESS_PORT: "10086"
      VLESS_PATH: "/vless"
      VLESS_LOG_LEVEL: "INFO"
    ports:
      - "10086:10086/tcp"
    # Uncomment to serve TLS directly from the container.
    # volumes:
    #   - ./certs:/certs:ro
